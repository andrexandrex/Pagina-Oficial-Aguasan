      </div>
      <div class="slide">
        <img class="faena1" src="{{site.baseurl}}/img/portada2.jpg" alt="Implementación de filtros de agua">
      </div>
      <div class="slide">
        <img class="faena1" src="{{site.baseurl}}/img/portada3.png" alt="Proyecto de saneamiento en comunidad rural">
      </div>
      <div class="slide">

      </div>
    </div>
    <script>
        let slideIndex = 0;
const slides = document.querySelectorAll('.slide');
const header = document.querySelector('header');

function showSlides() {
  // Hide all slides
  for (let i = 0; i < slides.length; i++) {
    slides[i].classList.remove('active');
  }
  // Show the current slide
  slideIndex++;
  if (slideIndex > slides.length) {
    slideIndex = 1;
  }
  slides[slideIndex - 1].classList.add('active');
  // Repeat the slide show every 5 seconds
  setTimeout(showSlides, 5000);
}

// Show the first slide
slides[slideIndex].classList.add('active');
// Start the slide show
setTimeout(showSlides, 5000);
    </script>
  </header>
  {% endunless %}
