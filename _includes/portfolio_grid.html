<!-- Portfolio Grid Section -->
<style>
  #portfolio { padding: 70px 0 90px; background: #fff; }
  .proj-card {
    display: block;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 22px rgba(0,0,0,0.10);
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    margin-bottom: 30px;
  }
  .proj-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    text-decoration: none;
  }
  .proj-card-imgwrap { position: relative; overflow: hidden; height: 220px; }
  .proj-card-imgwrap img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform 0.3s ease;
  }
  .proj-card:hover .proj-card-imgwrap img { transform: scale(1.05); }
  .proj-card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(13,63,107,0.55), rgba(13,63,107,0));
    opacity: 0; transition: opacity 0.22s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .proj-card:hover .proj-card-overlay { opacity: 1; }
  .proj-card-overlay .plus {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,255,255,0.92); color: #0d3f6b;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em;
  }
  .proj-card-body { padding: 20px 22px 22px; }
  .proj-card-body h4 { font-size: 1.1em; font-weight: 800; color: #0d3f6b; margin: 0 0 5px; }
  .proj-card-body p  { font-size: 0.9em; color: #888; margin: 0; }
</style>

<section id="portfolio">
    <div class="container">
        <div class="row">
        {% for post in site.posts %}{% if post.show_in_portfolio %}
            <div class="col-md-4 col-sm-6">
                <a href="#portfolioModal{{ post.modal-id }}" class="proj-card portfolio-link" data-toggle="modal">
                    <div class="proj-card-imgwrap">
                        <img src="{{ site.baseurl }}/img/portfolio/{{ post.thumbnail }}" alt="{{ post.title }}">
                        <div class="proj-card-overlay"><span class="plus"><i class="fa fa-plus"></i></span></div>
                    </div>
                    <div class="proj-card-body">
                        <h4>{{ post.title }}</h4>
                        <p>{{ post.subtitle }}</p>
                    </div>
                </a>
            </div>
        {% endif %}{% endfor %}
        </div>
    </div>
</section>
