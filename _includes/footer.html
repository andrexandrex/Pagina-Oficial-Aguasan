  <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <span class="copyright">Copyright &copy; {{ site.title }} {{ 'now' | date: "%Y" }}</span>
                </div>
                <div class="col-md-4">
                    <ul class="list-inline social-buttons">
                      {% for network in site.data.template.social %}                       
                      <li>
                        <a href="{{ network.url }}" class="social-icon social-{{ network.title }}">
                          <i class="fa fa-{{ network.title }}"></i>
                        </a>
                      </li>
                      {% endfor %}
                    </ul>
                  </div>
                <div class="col-md-4">
                    <ul class="list-inline quicklinks">
                        <li><a href="/politica-de-privacidad/">Política de Privacidad</a>
                        </li>
                        <li><a href="/terminos-y-condiciones/">Términos y Condiciones</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
