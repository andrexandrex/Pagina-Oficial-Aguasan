<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }} — AguaSan</title>
    <link rel="stylesheet" href="/css/agency.css">
    {% feed_meta %}
    {% seo %}
    {% include head.html %}
  </head>

  <body id="page-top">

    {% include header.html %}

    <!-- Page hero — extends under the fixed navbar so the white menu stays visible -->
    <div class="subpage-hero subpage-hero-sm">
      <div class="container">
        <h1>{{ page.title }}</h1>
        <a href="/" class="subpage-back">&larr; Volver al inicio</a>
      </div>
    </div>
    <style>
      .subpage-hero {
        background: linear-gradient(145deg, #0a2d4d 0%, #0d3f6b 45%, #1a6ea8 100%);
        padding: 150px 0 60px;
        text-align: center;
      }
      .subpage-hero-sm { padding: 130px 0 40px; }
      .subpage-hero h1 { color: #fff; font-size: 2.2em; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
      .subpage-hero p  { color: rgba(255,255,255,0.82); font-size: 1.15em; margin: 0; }
      .subpage-back {
        display: inline-block; margin-top: 18px;
        color: rgba(255,255,255,0.7); font-size: 0.9em; text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.35); padding-bottom: 2px;
      }
      .subpage-back:hover { color: #fff; text-decoration: none; }

      /* Legal / static content pages */
      .legal-content { max-width: 780px; margin: 0 auto; padding: 60px 15px 90px; }
      .legal-content h2 { font-size: 1.35em; font-weight: 800; color: #0d3f6b; margin: 42px 0 14px; }
      .legal-content h2:first-child { margin-top: 0; }
      .legal-content p { font-size: 1em; line-height: 1.75; color: #444; margin: 0 0 18px; }
      .legal-content ul { padding-left: 22px; margin: 0 0 18px; }
      .legal-content li { font-size: 1em; line-height: 1.75; color: #444; margin-bottom: 8px; }
      .legal-content a { color: #1a6ea8; font-weight: 600; }
      .legal-content strong { color: #0d3f6b; }
      .legal-note {
        background: #e8f4fd; border-left: 4px solid #1a6ea8; border-radius: 8px;
        padding: 16px 20px; margin: 0 0 22px; font-size: 0.96em; color: #1a4a70;
      }
    </style>

    <div class="legal-content">
      {{ content }}
    </div>

    {% include footer.html %}
    {% include js.html %}

  </body>
</html>
